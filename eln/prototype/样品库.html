<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELN 样品库 - 原型</title>

<style>
:root{
  --primary:#006de5;--primary-light:#f2f9ff;--primary-hover:#0059bd;
  --text:#333;--text-regular:#515a6e;--text-secondary:#909399;--text-placeholder:#c0c4cc;
  --border:#dadada;--border-light:#e5e5e5;--bg-page:#f0f2f5;--white:#fff;
  --header-h:60px;--tab-h:40px;--sidebar-w:90px;--submenu-w:160px;
  --danger:#ed4014;--success:#67c23a;--warning:#e6a23c;--radius:4px;
}
*{margin:0;padding:0;box-sizing:border-box;}
[class^="ri-"],[class*=" ri-"]{display:inline-flex;align-items:center;justify-content:center;line-height:1;font-style:normal;vertical-align:middle;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;color:var(--text);background:var(--bg-page);overflow:hidden;}
.topbar{height:var(--header-h);background:linear-gradient(90deg,#1e4fd8 0%,#2b6cff 45%,#3b7dff 100%);display:flex;align-items:center;padding:0 20px;}
.topbar-logo{display:flex;align-items:center;gap:8px;}
.logo-mark{width:30px;height:30px;border-radius:5px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--primary);font-size:17px;font-style:italic;}
.logo-text{color:#fff;font-weight:600;font-size:15px;}
.logo-sub{color:rgba(255,255,255,.85);font-size:14px;margin-left:4px;}
.topbar-search{width:380px;height:34px;margin-left:70px;position:relative;}
.topbar-search input{width:100%;height:100%;border:none;border-radius:17px;background:rgba(255,255,255,.22);padding:0 38px 0 16px;color:#fff;font-size:13px;outline:none;}
.topbar-search input::placeholder{color:rgba(255,255,255,.75);}
.topbar-search .search-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.85);font-size:16px;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:22px;color:#fff;font-size:14px;}
.topbar-item{position:relative;cursor:pointer;}
.topbar-badge{position:absolute;top:-8px;right:-10px;background:#f5222d;color:#fff;font-size:11px;line-height:15px;padding:0 5px;border-radius:8px;}
.topbar-icon{font-size:18px;position:relative;}
.topbar-user{display:flex;align-items:center;gap:7px;}
.avatar{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;}
.layout{display:flex;height:calc(100vh - var(--header-h));}
.sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--border-light);display:flex;flex-direction:column;align-items:center;padding-top:10px;flex-shrink:0;}
.side-plus{width:36px;height:36px;border-radius:50%;background:#2f8bff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px;}
.nav-item{width:72px;padding:9px 0;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:6px;color:var(--text-regular);margin-bottom:2px;}
.nav-item.active{background:var(--primary-light);color:var(--primary);}
.nav-item .nav-icon{font-size:20px;}
.nav-item .nav-label{font-size:12px;}
.submenu{width:var(--submenu-w);background:#fff;border-right:1px solid var(--border-light);padding:14px 0;flex-shrink:0;}
.submenu-title{font-size:14px;font-weight:600;padding:0 18px 12px;}
.submenu-item{padding:10px 18px;font-size:13px;color:var(--text-regular);border-left:3px solid transparent;}
.submenu-item.active{color:var(--primary);background:var(--primary-light);border-left-color:var(--primary);font-weight:500;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.tabs{height:var(--tab-h);background:#fff;display:flex;align-items:center;border-bottom:1px solid var(--border-light);padding:0 8px;gap:2px;}
.tab{display:flex;align-items:center;gap:8px;padding:0 14px;height:32px;font-size:13px;color:var(--text-regular);background:#f5f7fa;border-radius:4px;cursor:pointer;}
.tab.active{background:var(--primary-light);color:var(--primary);font-weight:500;}
.content{flex:1;overflow:auto;background:#fff;margin:8px;border-radius:4px;}
.demo-note{margin:12px 16px 0;padding:8px 12px;background:#f2f9ff;border:1px solid #d6e8ff;border-radius:4px;font-size:12px;color:var(--text-regular);line-height:1.6;}
.filter-bar{padding:14px 16px 10px;}
.filter-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.filter-input,.filter-select,input.field,select.field{
  height:32px;border:1px solid var(--border);border-radius:var(--radius);padding:0 12px;font-size:13px;color:var(--text);background:#fff;outline:none;
}
.filter-input{width:260px;}
.filter-select{min-width:130px;}
.filter-input:focus,input.field:focus,select.field:focus{border-color:var(--primary);}
.filter-actions{margin-left:auto;display:flex;gap:10px;}
.btn{height:32px;padding:0 16px;border-radius:var(--radius);border:1px solid var(--border);background:#fff;font-size:13px;color:var(--text-regular);cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.btn:hover{border-color:var(--primary);color:var(--primary);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-hover);color:#fff;}
.btn[disabled],.btn-primary[disabled]{background:#f5f7fa;border-color:var(--border);color:#c0c4cc;cursor:not-allowed;}
.btn-link{border:none;background:none;color:var(--primary);padding:0 4px;font-size:13px;cursor:pointer;}
.btn-link.danger{color:var(--danger);}
.btn-link[disabled]{color:#c0c4cc;cursor:not-allowed;}
.table-wrap{border:1px solid var(--border-light);border-radius:var(--radius);overflow:auto;margin:0 16px 12px;}
table.el-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;white-space:nowrap;}
table.el-table th{background:#f5f7fa;font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border-light);}
table.el-table td{padding:9px 12px;border-bottom:1px solid var(--border-light);color:var(--text-regular);}
table.el-table tbody tr:hover{background:#fafcff;}
.cell-link{color:var(--primary);cursor:pointer;}
.cell-link:hover{text-decoration:underline;}
.tag{display:inline-block;padding:1px 7px;border-radius:3px;font-size:12px;line-height:18px;border:1px solid;}
.tag-ok{color:#67c23a;border-color:#c2e7b0;background:#f0f9eb;}
.tag-end{color:#909399;border-color:#e4e7ed;background:#f4f4f5;}
.tag-dead{color:#ed4014;border-color:#fbc4c4;background:#fef0f0;}
.tag-wait{color:#e6a23c;border-color:#f5dab1;background:#fdf6ec;}
.pagination{display:flex;justify-content:flex-end;gap:10px;padding:4px 16px 16px;font-size:13px;color:var(--text-regular);}
.detail-head{display:flex;align-items:center;gap:12px;padding:14px 16px 0;}
.detail-head h2{font-size:16px;font-weight:600;}
.meta{padding:8px 16px 0;color:var(--text-secondary);font-size:13px;display:flex;gap:18px;flex-wrap:wrap;}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:14px 16px;}
.card{border:1px solid var(--border-light);border-radius:4px;padding:10px 12px;background:#fafbfc;}
.card .k{font-size:12px;color:var(--text-secondary);}
.card .v{margin-top:4px;font-size:18px;font-weight:600;color:var(--text);}
.card .v em{font-style:normal;font-size:12px;font-weight:400;color:var(--text-secondary);margin-left:4px;}
.actions{padding:0 16px 12px;display:flex;gap:8px;flex-wrap:wrap;}
.hint{margin:0 16px 12px;padding:8px 12px;background:#fdf6ec;border:1px solid #f5dab1;border-radius:4px;font-size:12px;color:#b88230;}
.subtabs{display:flex;gap:20px;padding:0 16px;border-bottom:1px solid var(--border-light);}
.subtabs span{padding:8px 0;cursor:pointer;color:var(--text-regular);font-size:13px;}
.subtabs span.on{color:var(--primary);font-weight:500;border-bottom:2px solid var(--primary);}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;}
.mask.show{display:block;}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:4px;z-index:301;display:none;flex-direction:column;width:640px;max-height:86vh;box-shadow:0 6px 30px rgba(0,0,0,.2);}
.modal.show{display:flex;}
.modal-header{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border-light);}
.mh-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
.mh-title::before{content:"";width:3px;height:14px;background:var(--primary);border-radius:2px;}
.mh-close{font-size:17px;color:var(--text-secondary);cursor:pointer;}
.modal-body{padding:16px 20px;overflow:auto;}
.modal-footer{height:56px;border-top:1px solid var(--border-light);display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:0 20px;}
.form-row{display:flex;align-items:flex-start;margin-bottom:14px;gap:12px;}
.form-row label{width:110px;flex-shrink:0;line-height:32px;color:var(--text-regular);text-align:right;}
.form-row label i{color:var(--danger);margin-right:2px;font-style:normal;}
.form-row .ctrl{flex:1;}
.help{font-size:12px;color:var(--text-secondary);margin-top:4px;}
.err{color:var(--danger);font-size:12px;margin-top:4px;min-height:16px;}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #f5dab1;color:#b88230;padding:8px 16px;border-radius:4px;z-index:400;display:none;box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:13px;}
.toast.show{display:block;}
.toast.ok{border-color:#c2e7b0;color:#67c23a;}
</style>
</head>

<header class="topbar">

  <div class="main">

</div>
<div class="mask" id="mask" onclick="closeModal()"></div>

function currentViewer(){ return viewers.find(v=>v.id===viewerId); }
function objOf(s){ return objects.find(o=>o.code===s.code); }
function canSeeObject(o){
  const v = currentViewer();
  if(!o) return false;
  if(v.role==='admin' || o.owner===v.name) return true;
  if(o.status!=='有效') return false;
  if(o.projectVisible && v.projects.includes(o.project)) return true;
  if(o.deptVisible && v.dept===o.dept) return true;
  return false;
}
function canSee(s){ return canSeeObject(objOf(s)); }
function canSeeTask(t){
  const v = currentViewer();
  if(v.role==='admin' || t.owner===v.name) return true;
  if(!t.objectCode) return false;
  return canSeeObject(objects.find(o=>o.code===t.objectCode));
}
function ready(s){ const o = objOf(s); return o && o.status==='有效'; }
function visLabel(o){
  const parts = [];
  if(o.projectVisible) parts.push('项目成员');
  if(o.deptVisible) parts.push('部门成员');
  return parts.length ? parts.join('、') : '仅归属人';
}
function avail(s){ return round(s.unstocked - s.retained); }
function round(n){ return Math.round(n * 1000) / 1000; }
function statusOf(s){
  if (s.destroyed && s.unstocked === 0) return '已销毁';
  if (s.unstocked === 0 && s.inventory === 0) return '已耗尽';
  return '可用';
}
function tag(st){
  const cls = st==='可用' ? 'tag-ok' : st==='已销毁' ? 'tag-dead' : 'tag-end';
  return `<span class="tag ${cls}">${st}</span>`;
}
function tagObj(st){
  const cls = st==='有效' ? 'tag-ok' : 'tag-wait';
  return `<span class="tag ${cls}">${st}</span>`;
}
function qty(n, unit){ return `${n} ${unit}`; }
function find(code){ return samples.find(s=>s.code===code); }
function now(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function toast(msg, ok){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (ok ? ' ok' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 2200);
}
function pushFlow(s, type, amount, before, after, to){
  s.flows.unshift({time:now(), type, qty:qty(amount, s.unit), before:qty(before, s.unit), after:qty(after, s.unit), to});
}

function setScene(next){ scene = next; view = 'list'; render(); }
function setViewer(id){
  viewerId = id;
  if(currentId && find(currentId) && !canSee(find(currentId))){ view='list'; currentId=null; }
  render();
}
function viewerBar(){
  return viewers.map(v=>`<button class="btn ${v.id===viewerId?'btn-primary':''}" onclick="setViewer('${v.id}')">${v.short}</button>`).join('');
}
function render(){
  document.getElementById('who').textContent = currentViewer().name;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.scene===scene));
  const html = scene==='out' ? outHtml() : scene==='reg' ? regHtml() : (view==='list' ? listHtml() : detailHtml());
  document.getElementById('view').innerHTML = html;
}
function listHtml(){
  const rows = samples.filter(s=>{
    if(!canSee(s)) return false;
    const hit = !filters.q || (s.code+s.name).toLowerCase().includes(filters.q.toLowerCase());
    return hit && (!filters.source || s.source===filters.source) && (!filters.status || statusOf(s)===filters.status);
  });
  const body = rows.length ? rows.map(s=>{
    const st = statusOf(s);
    const o = objOf(s);
    const canReq = ready(s) && st==='可用' && (avail(s)>0 || s.inventory>0);
    const objTag = o.status==='有效' ? '' : ' '+tagObj(o.status);
    return `<tr>
      <td><span class="cell-link" onclick="openDetail('${s.code}')">${s.code}</span></td>
      <td>${s.name}${objTag}</td>
      <td>${s.source}</td>
      <td>${o.owner}</td>
      <td>${qty(s.output, s.unit)}</td>
      <td>${qty(s.unstocked, s.unit)}</td>
      <td>${qty(s.inventory, s.unit)}</td>
      <td>${tag(st)}</td>
      <td>
        <button class="btn-link" onclick="openDetail('${s.code}')">详情</button>
        <button class="btn-link" ${canReq?'': 'disabled'} onclick="openDetail('${s.code}');openAction('req')">发起请验</button>
      </td>
    </tr>`;
  }).join('') : `<tr><td colspan="9" style="text-align:center;color:#909399;padding:28px;">没有符合条件的样品。换一个查看人，或到注册对象里看尚未建台账的对象。</td></tr>`;
  return `
    <div class="demo-note"><b>样品库</b>管真实样品和量。能不能看见、能不能请验，沿用注册对象的状态和可见范围。待审批只对归属人和管理授权可见，且不能请验、实验使用、入库。李明只能看到项目 DL34-012 上勾了「项目成员」、且已经生效的样品。上线前的历史请验不出现在本列表。
      <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">当前查看人 ${viewerBar()}</div>
    </div>
    <div class="filter-bar"><div class="filter-row">
      <input class="filter-input" id="q" placeholder="样品编号 / 名称" value="${esc(filters.q)}">
      <button class="btn" onclick="filters.q=document.getElementById('q').value;render()">查询</button>
      <select class="filter-select" onchange="filters.source=this.value;render()">
        <option value="">全部来源</option>
        <option ${filters.source==='实验产出'?'selected':''}>实验产出</option>
        <option ${filters.source==='注册对象'?'selected':''}>注册对象</option>
      </select>
      <select class="filter-select" onchange="filters.status=this.value;render()">
        <option value="">全部状态</option>
        ${['可用','已耗尽','已销毁'].map(x=>`<option ${filters.status===x?'selected':''}>${x}</option>`).join('')}
      </select>
      <div class="filter-actions"><button class="btn btn-primary" onclick="openCreate()">从注册对象新建</button></div>
    </div></div>
    <div class="table-wrap"><table class="el-table"><thead><tr>
      <th>样品编号</th><th>样品名称</th><th>来源</th><th>归属人</th><th>产出量</th><th>未入库量</th><th>物料库存量</th><th>状态</th><th>操作</th>
    </tr></thead><tbody>${body}</tbody></table></div>
    <div class="pagination">共 ${rows.length} 条</div>`;
}
function detailHtml(){
  const s = find(currentId);
  if(!s){ view='list'; return listHtml(); }
  const st = statusOf(s);
  const o = objOf(s);
  const a = avail(s);
  const materialOnly = ready(s) && s.unstocked===0 && s.inventory>0 && st==='可用';
  const pending = !ready(s);
  const canUse = st==='可用';
  const dis = (ok, why)=> ok ? '' : `disabled title="${why}"`;
  const whyGate = pending ? '对象未生效' : '';
  const panels = {
    flow: table(['时间','类型','数量','未入库量前','未入库量后','去向'], s.flows.map(f=>[f.time,f.type,f.qty,f.before,f.after,f.to])),
    req: table(['请验单号','样品批号','扣量通道','时间'], s.requests.map(r=>[r.no,r.batch,r.channel,r.time])),
    box: table(['容器编号','仓库','剩余量','出库方式'], s.containers.map(c=>[c.code,c.warehouse,qty(c.qty,s.unit), c.whole?'整体出库':'按量']))
  };
  return `
    <div class="detail-head">
      <button class="btn" onclick="view='list';render()">返回</button>
      <h2>${s.code} ${s.name}</h2>${tag(st)}
    </div>
    <div class="meta"><span>来源：${s.source} · ${s.ref}</span><span>归属人：${o.owner}</span><span>项目：${o.project}</span><span>部门：${o.dept}</span><span>可见范围：${visLabel(o)}</span><span>对象状态：${o.status}</span><span>单位：${s.unit}</span></div>
    <div class="cards">
      ${card('产出量', s.output, s.unit)}
      ${card('未入库量', s.unstocked, s.unit)}
      ${card('留样量', s.retained, s.unit)}
      ${card('可用量', a, s.unit)}
      ${card('入库量', s.inbound, s.unit)}
      ${card('物料库存量', s.inventory, s.unit)}
    </div>
    ${pending ? `<div class="hint">对象状态为${o.status}。这条台账只对归属人和管理授权可见。请验、实验使用和入库要等审批通过、对象变为有效。留样和销毁仍可在台账上操作。</div>` : ''}
    ${materialOnly ? '<div class="hint">未入库量为 0，台账侧已无可扣量。请验和实验使用只能选择物料容器。入库、留样、销毁不可用。</div>' : ''}
    <div class="actions">
      <button class="btn btn-primary" ${dis(!whyGate && canUse && (a>0||s.inventory>0), whyGate || '当前不能请验')} onclick="openAction('req')">发起请验</button>
      <button class="btn" ${dis(!whyGate && canUse && (a>0||s.inventory>0), whyGate || '当前不能实验使用')} onclick="openAction('use')">实验使用</button>
      <button class="btn" ${dis(!whyGate && canUse && a>0, whyGate || '没有可用量')} onclick="openAction('in')">入库</button>
      <button class="btn" ${dis(canUse && a>0, '没有可用量')} onclick="openAction('keep')">留样</button>
      <button class="btn" ${dis(canUse && s.retained>0, '没有留样量')} onclick="openAction('dropKeep')">销毁留样</button>
      <button class="btn" ${dis(canUse && a>0, '没有可用量')} onclick="openAction('drop')">销毁</button>
    </div>
    <div class="subtabs">
      <span class="${detailTab==='flow'?'on':''}" onclick="detailTab='flow';render()">流水</span>
      <span class="${detailTab==='req'?'on':''}" onclick="detailTab='req';render()">关联请验</span>
      <span class="${detailTab==='box'?'on':''}" onclick="detailTab='box';render()">关联容器</span>
    </div>
    <div style="padding-top:12px;">${panels[detailTab] || '<div style="padding:24px;color:#909399;">暂无数据</div>'}</div>`;
}
function card(k,v,u){ return `<div class="card"><div class="k">${k}</div><div class="v">${v}<em>${u}</em></div></div>`; }
function table(heads, rows){
  if(!rows.length) return '<div style="padding:24px;color:#909399;">暂无数据</div>';
  return `<div class="table-wrap"><table class="el-table"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')
  }</tbody></table></div>`;
}
function esc(s){ return String(s).replace(/"/g,'&quot;'); }
function openDetail(code){
  const s = find(code);
  if(!s || !canSee(s)){ toast('没有该样品的查看权限'); return; }
  currentId=code; view='detail'; detailTab='flow'; scene='lib'; render();
}

function openModal(title, body, onOk){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('mask').classList.add('show');
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalOk').onclick = onOk;
}
function closeModal(){
  document.getElementById('mask').classList.remove('show');
  document.getElementById('modal').classList.remove('show');
}
function fieldNum(id){ const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? null : v; }
function setErr(msg){ document.getElementById('formErr').textContent = msg || ''; }

function blankSample(obj, n, unit, source, ref){
  return {
    code:obj.code, name:obj.name, source, ref, owner:obj.owner, project:obj.project, unit,
    output:n, unstocked:n, retained:0, inbound:0, inventory:0, destroyed:false,
    containers:[], requests:[],
    flows:[{time:now(), type:'登记', qty:qty(n, unit), before:'—', after:qty(n, unit), to:ref}]
  };
}
function openCreate(prefill){
  if(typeof prefill!=='string') prefill = '';
  if(prefill){
    const preset = objects.find(o=>o.code===prefill);
    if(!preset || !canSeeObject(preset)){ toast('没有该对象的查看权限'); return; }
    if(preset.status!=='有效'){ toast('待审批对象不能生成台账，等审批通过后再操作'); return; }
    if(find(prefill)){ toast('已有台账 '+prefill); openDetail(prefill); return; }
  }
  const selectable = objects.filter(o=>o.status==='有效' && canSeeObject(o));
  if(!selectable.length){ toast('没有可建台账的有效对象'); return; }
  const opts = selectable.map(o=>{
    const has = find(o.code) ? '（已有台账）' : '';
    return `<option value="${o.code}" ${o.code===prefill?'selected':''}>${o.code} ${o.name}${has}</option>`;
  }).join('');
  openModal('从注册对象新建', `
    <div class="form-row"><label><i>*</i>注册对象</label><div class="ctrl"><select class="field" id="obj" style="width:100%">${opts}</select>
      <div class="help">同一注册对象只允许一条台账。对象须为有效。这一步只写产出量，不写容器。</div></div></div>
    <div class="form-row"><label><i>*</i>产出量</label><div class="ctrl"><input class="field" id="outQty" style="width:160px" placeholder="数量">
      <select class="field" id="outUnit"><option>g</option><option>mg</option><option>支</option><option>瓶</option></select></div></div>
    <div class="err" id="formErr"></div>`, submitCreate);
}
function submitCreate(){
  const code = document.getElementById('obj').value;
  const obj = objects.find(o=>o.code===code);
  const n = fieldNum('outQty');
  const unit = document.getElementById('outUnit').value;
  if(!obj || !canSeeObject(obj)){ setErr('没有该对象的查看权限'); return; }
  if(obj.status!=='有效'){ setErr('只能为有效的注册对象生成台账'); return; }
  if(find(code)){ setErr('已有台账 '+code+'，请前往查看'); return; }
  if(n===null || n<=0){ setErr('请填写大于 0 的产出量'); return; }
  samples.unshift(blankSample(obj, n, unit, '注册对象', '手工创建'));
  closeModal();
  toast('已生成样品台账 '+code, true);
  openDetail(code);
}

function openAction(kind){
  const s = find(currentId);
  if(!s || !canSee(s)) return;
  const a = avail(s);
  if((kind==='req' || kind==='use' || kind==='in') && !ready(s)){
    toast('对象待审批，不能请验、实验使用或入库');
    return;
  }
  if(kind==='req' || kind==='use') return openReq(s, a, kind);
  const map = {
    in: ['入库', `本次入库量不能超过可用量 ${qty(a,s.unit)}。入库后写容器，未入库量减少，物料库存量增加。`, 'inQty', a, submitIn],
    keep: ['留样', `留样量从可用量里冻住，未入库量不变。当前可用量 ${qty(a,s.unit)}。`, 'keepQty', a, submitKeep],
    dropKeep: ['销毁留样', `只减少留样量和未入库量，不能改回可用量。当前留样量 ${qty(s.retained,s.unit)}。`, 'dkQty', s.retained, submitDropKeep],
    drop: ['销毁', `只销毁尚未留样的可用量 ${qty(a,s.unit)}。未入库量归零后状态变为已销毁，不看物料库存还剩多少。`, 'dropQty', a, submitDrop]
  };
  const [title, help, id, max, fn] = map[kind];
  let extra = '';
  if(kind==='in'){
    extra = `
      <div class="form-row"><label><i>*</i>容器编号</label><div class="ctrl"><input class="field" id="boxCode" style="width:220px" placeholder="如 C-新编号"></div></div>
      <div class="form-row"><label><i>*</i>仓库</label><div class="ctrl"><select class="field" id="wh"><option>产物库 A</option><option>冷库</option><option>细胞库</option><option>室温柜 C</option></select></div></div>`;
  }
  openModal(title, `
    <div class="form-row"><label>样品</label><div class="ctrl" style="line-height:32px;">${s.code} ${s.name}</div></div>
    <div class="form-row"><label><i>*</i>数量</label><div class="ctrl"><input class="field" id="${id}" style="width:160px" placeholder="≤ ${max}"> <span>${s.unit}</span>
      <div class="help">${help}</div></div></div>
    ${extra}
    <div class="err" id="formErr"></div>`, fn);
}
function readQty(id, max, label){
  const n = fieldNum(id);
  if(n===null || n<=0){ setErr('请填写大于 0 的'+label); return null; }
  if(n>max){ setErr(label+'不能超过 '+max); return null; }
  return n;
}
function submitIn(){
  const s = find(currentId);
  const n = readQty('inQty', avail(s), '入库量');
  if(n===null) return;
  const box = document.getElementById('boxCode').value.trim();
  if(!box){ setErr('请填写容器编号'); return; }
  const before = s.unstocked;
  s.unstocked = round(s.unstocked - n);
  s.inbound = round(s.inbound + n);
  s.inventory = round(s.inventory + n);
  s.containers.push({code:box, warehouse:document.getElementById('wh').value, qty:n, whole:false});
  pushFlow(s, '入库', n, before, s.unstocked, box);
  closeModal(); toast('已入库 '+qty(n,s.unit), true); render();
}
function submitKeep(){
  const s = find(currentId);
  const n = readQty('keepQty', avail(s), '留样量');
  if(n===null) return;
  const before = s.unstocked;
  s.retained = round(s.retained + n);
  pushFlow(s, '留样', n, before, s.unstocked, '—');
  closeModal(); toast('已留样 '+qty(n,s.unit), true); render();
}
function submitDropKeep(){
  const s = find(currentId);
  const n = readQty('dkQty', s.retained, '销毁留样');
  if(n===null) return;
  const before = s.unstocked;
  s.retained = round(s.retained - n);
  s.unstocked = round(s.unstocked - n);
  if(s.unstocked===0) s.destroyed = true;
  pushFlow(s, '销毁留样', n, before, s.unstocked, '—');
  closeModal(); toast('已销毁留样 '+qty(n,s.unit), true); render();
}
function submitDrop(){
  const s = find(currentId);
  const n = readQty('dropQty', avail(s), '销毁数量');
  if(n===null) return;
  const before = s.unstocked;
  s.unstocked = round(s.unstocked - n);
  if(s.unstocked===0) s.destroyed = true;
  pushFlow(s, '销毁', n, before, s.unstocked, '—');
  closeModal(); toast(s.destroyed ? '未入库量已销毁，状态为已销毁' : '已销毁 '+qty(n,s.unit), true); render();
}

function openReq(s, a, kind){
  const boxes = s.containers.filter(c=>c.qty>0);
  const ledgerOff = a<=0;
  const use = kind==='use';
  const title = use ? '实验使用' : '发起请验';
  const boxRows = boxes.length ? boxes.map((c,i)=>`
    <tr>
      <td><input type="checkbox" class="useBox" data-i="${i}" ${c.whole?'checked':''} onchange="syncWhole(this)"></td>
      <td>${c.code}</td><td>${c.warehouse}</td><td>${qty(c.qty, s.unit)}</td>
      <td>${c.whole?'整体出库':'按量'}</td>
      <td><input class="field boxQty" data-i="${i}" style="width:90px" ${c.whole?`value="${c.qty}" disabled`:''}></td>
    </tr>`).join('') : '<tr><td colspan="6" style="color:#909399;">没有剩余量大于 0 的容器</td></tr>';
  openModal(title, `
    <div class="form-row"><label>样品</label><div class="ctrl" style="line-height:32px;">${s.code} ${s.name}</div></div>
    <div class="form-row"><label>未入库</label><div class="ctrl">
      <input class="field" id="ledgerQty" style="width:160px" placeholder="使用量" ${ledgerOff?'disabled':''}> <span>${s.unit}</span>
      <div class="help">${ledgerOff?'未入库可用量为 0，本通道不可用':`从可用量扣减，当前可用量 ${qty(a,s.unit)}`}</div>
    </div></div>
    <div class="form-row"><label>物料容器</label><div class="ctrl">
      <div class="table-wrap" style="margin:0;"><table class="el-table"><thead><tr><th></th><th>容器</th><th>仓库</th><th>剩余</th><th>方式</th><th>使用量</th></tr></thead><tbody>${boxRows}</tbody></table></div>
      <div class="help">两个通道至少填一项。容器用量不改变未入库量和入库量。</div>
    </div></div>
    <div class="err" id="formErr"></div>`, ()=>submitReq(s, a, boxes, kind));
}
function syncWhole(cb){
  const input = document.querySelector(`.boxQty[data-i="${cb.dataset.i}"]`);
  if(input && input.disabled) return;
}
function submitReq(s, a, boxes, kind){
  const use = kind==='use';
  let ledger = 0;
  if(a>0){
    const raw = document.getElementById('ledgerQty').value.trim();
    if(raw){
      ledger = parseFloat(raw);
      if(isNaN(ledger) || ledger<=0){ setErr('未入库使用量须大于 0'); return; }
      if(ledger>a){ setErr('未入库使用量不能超过可用量 '+a); return; }
    }
  }
  const picked = [];
  document.querySelectorAll('.useBox:checked').forEach(cb=>{
    const i = +cb.dataset.i;
    const c = boxes[i];
    const input = document.querySelector(`.boxQty[data-i="${i}"]`);
    const n = c.whole ? c.qty : parseFloat(input.value);
    if(isNaN(n) || n<=0){ picked.push({err:'请填写容器 '+c.code+' 的使用量'}); return; }
    if(n>c.qty){ picked.push({err:'容器 '+c.code+' 使用量不能超过剩余 '+c.qty}); return; }
    picked.push({c, n});
  });
  const bad = picked.find(p=>p.err);
  if(bad){ setErr(bad.err); return; }
  if(!ledger && !picked.length){ setErr('未入库和物料容器至少填写一项'); return; }
  const channels = [];
  if(ledger){
    const before = s.unstocked;
    s.unstocked = round(s.unstocked - ledger);
    pushFlow(s, use?'实验使用':'请验消耗', ledger, before, s.unstocked, use?'实验记录':'请验单');
    channels.push('台账 '+qty(ledger, s.unit));
  }
  picked.forEach(p=>{
    p.c.qty = round(p.c.qty - p.n);
    s.inventory = round(s.inventory - p.n);
    channels.push('物料·'+p.c.code+' '+qty(p.n, s.unit));
    s.flows.unshift({time:now(), type:use?'实验使用':'请验消耗', qty:qty(p.n,s.unit), before:qty(s.unstocked,s.unit), after:qty(s.unstocked,s.unit), to:p.c.code});
  });
  if(use){
    closeModal();
    toast('已按实验使用扣量', true);
    detailTab = 'flow';
    render();
    return;
  }
  seq += 1;
  const no = 'QY-20260922-'+String(seq).padStart(3,'0');
  s.requests.unshift({no, batch:'YPPH-20260922-'+String(seq).padStart(3,'0'), channel:channels.join(' + '), time:now()});
  s.flows.forEach(f=>{ if(f.to==='请验单') f.to = no; });
  closeModal();
  toast('已生成请验单 '+no+'，进入样品池', true);
  detailTab = 'req';
  render();
}

function outHtml(){
  const rows = tasks.filter(canSeeTask);
  const body = rows.length ? rows.map(t=>{
    const linked = t.objectCode ? `<span class="cell-link" onclick="openDetail('${t.objectCode}')">${t.objectCode}</span>` : '—';
    const op = t.status==='待交货'
      ? `<button class="btn-link" onclick="openOutput('${t.no}')">产出登记</button>`
      : (t.objectCode ? `<button class="btn-link" onclick="openDetail('${t.objectCode}')">查看台账</button>` : '');
    const stTag = t.status==='已交货' ? '<span class="tag tag-ok">已交货</span>' : '<span class="tag tag-wait">待交货</span>';
    return `<tr>
      <td>${t.no}</td><td>${t.exp}</td><td>${t.model}</td><td>${t.workflow?'开启':'未开启'}</td>
      <td>${t.owner}</td><td>${t.project}</td><td>${stTag}</td>
      <td>${linked}</td><td>${op}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="9" style="text-align:center;color:#909399;padding:28px;">没有你能看到的合成任务</td></tr>`;
  return `
    <div class="demo-note"><b>产出登记</b>在正式产品里挂在合成任务的交货。保存时注册对象并写入产出量，生成样品台账。不填写容器和仓库；要进物料库，回到样品库详情做入库。对象模型开启工作流时，对象先进入待审批。
      <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">当前查看人 ${viewerBar()}</div>
    </div>
    <div class="table-wrap" style="margin-top:12px;"><table class="el-table"><thead><tr>
      <th>合成任务</th><th>实验记录</th><th>对象模型</th><th>工作流</th><th>执行人</th><th>项目</th><th>交货状态</th><th>注册对象</th><th>操作</th>
    </tr></thead><tbody>${body}</tbody></table></div>
    <div class="pagination">共 ${rows.length} 条</div>`;
}
function regHtml(){
  const rows = objects.filter(canSeeObject);
  const body = rows.map(o=>{
    const ledger = find(o.code);
    let op = '';
    if(ledger) op = `<button class="btn-link" onclick="openDetail('${o.code}')">查看台账</button>`;
    else if(o.status==='有效') op = `<button class="btn-link" onclick="openCreate('${o.code}')">生成台账</button>`;
    else op = `<button class="btn-link" disabled title="待审批对象不能被引用">生成台账</button>`;
    return `<tr>
      <td>${o.code}</td><td>${o.name}</td><td>${o.model}</td><td>${tagObj(o.status)}</td>
      <td>${visLabel(o)}</td><td>${o.owner}</td><td>${o.project}</td>
      <td>${ledger ? tag(statusOf(ledger)) : '—'}</td><td>${op}</td>
    </tr>`;
  }).join('');
  return `
    <div class="demo-note"><b>注册对象</b>是样品身份。一个对象最多一条样品台账。从这里为已有的有效对象补建台账时，同样只填产出量。待审批对象不对他人显示，也不能在这里生成台账。
      <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">当前查看人 ${viewerBar()}</div>
    </div>
    <div class="table-wrap" style="margin-top:12px;"><table class="el-table"><thead><tr>
      <th>对象编号</th><th>名称</th><th>对象模型</th><th>对象状态</th><th>可见范围</th><th>归属人</th><th>项目</th><th>样品台账</th><th>操作</th>
    </tr></thead><tbody>${body}</tbody></table></div>
    <div class="pagination">共 ${rows.length} 条</div>`;
}
function openOutput(no){
  const t = tasks.find(x=>x.no===no);
  if(!t || !canSeeTask(t)){ toast('没有该任务的操作权限'); return; }
  if(t.status!=='待交货'){ toast('该任务已交货'); return; }
  const flowNote = t.workflow
    ? '本模型已开启工作流。保存后对象为待审批：台账会生成，但不能请验、不能实验使用、不能入库，他人也看不到。'
    : '本模型未开启工作流。保存后对象直接有效，可以请验和使用。';
  openModal('产出登记', `
    <div class="form-row"><label>合成任务</label><div class="ctrl" style="line-height:32px;">${t.no} · ${t.exp}</div></div>
    <div class="form-row"><label>对象模型</label><div class="ctrl" style="line-height:32px;">${t.model}</div></div>
    <div class="form-row"><label><i>*</i>名称</label><div class="ctrl"><input class="field" id="objName" style="width:100%" placeholder="产出物名称"></div></div>
    <div class="form-row"><label>项目</label><div class="ctrl" style="line-height:32px;">${t.project}</div></div>
    <div class="form-row"><label>部门</label><div class="ctrl" style="line-height:32px;">${t.dept}</div></div>
    <div class="form-row"><label>可见范围</label><div class="ctrl" style="line-height:32px;">
      <label style="width:auto;"><input type="checkbox" id="visProj"> 项目成员</label>
      <label style="width:auto;margin-left:16px;"><input type="checkbox" id="visDept"> 部门成员</label>
      <div class="help">默认不勾选。不勾选时只有归属人和管理授权能看到这条样品。</div>
    </div></div>
    <div class="form-row"><label><i>*</i>产出量</label><div class="ctrl"><input class="field" id="outQty" style="width:160px" placeholder="数量">
      <select class="field" id="outUnit"><option>g</option><option>mg</option><option>支</option><option>瓶</option></select>
      <div class="help">${flowNote}不在这里填写容器和仓库，入库时再到样品库写容器。</div>
    </div></div>
    <input type="hidden" id="taskNo" value="${t.no}">
    <div class="err" id="formErr"></div>`, submitOutput);
}
function submitOutput(){
  const task = tasks.find(t=>t.no===document.getElementById('taskNo').value);
  const name = document.getElementById('objName').value.trim();
  const n = fieldNum('outQty');
  const unit = document.getElementById('outUnit').value;
  if(!task || task.status!=='待交货'){ setErr('该任务已交货'); return; }
  if(!name){ setErr('请填写名称'); return; }
  if(n===null || n<=0){ setErr('请填写大于 0 的产出量'); return; }
  objSeq += 1;
  const prefix = task.model==='参考序列' ? 'RS' : 'CMP';
  const code = prefix+'-20260922-'+String(objSeq).padStart(3,'0');
  const status = task.workflow ? '待审批' : '有效';
  const obj = {
    code, name, model:task.model, status, owner:task.owner, project:task.project, dept:task.dept,
    projectVisible: document.getElementById('visProj').checked,
    deptVisible: document.getElementById('visDept').checked
  };
  objects.unshift(obj);
  samples.unshift(blankSample(obj, n, unit, '实验产出', task.exp));
  task.status = '已交货';
  task.objectCode = code;
  closeModal();
  toast(status==='待审批' ? '已注册对象并生成台账。对象待审批，暂不能扣量' : '已注册对象并生成台账', true);
  openDetail(code);
}
render();
</script>
</body>
</html>
