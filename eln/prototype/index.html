<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>ELN 实验产出 · 入库原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    html, body { overflow-x: hidden; }
    .focus-ring:focus { outline: none; border-color: #4096ff; box-shadow: 0 0 0 2px rgba(5,145,255,0.12); }
    .btn-primary { background: #1677ff; transition: background-color .15s; }
    .btn-primary:hover { background-color: #4096ff; }
    .btn-plain { transition: background-color .15s; }
    .btn-plain:hover { background-color: #f5f5f5; }
    .ant-ctrl {
      height: 32px; width: 100%; border: 1px solid #d9d9d9; border-radius: 6px;
      padding: 0 11px; font-size: 14px; line-height: 32px; background: #fff; color: rgba(0,0,0,.88);
    }
    textarea.ant-ctrl { height: auto; min-height: 64px; line-height: 22px; padding: 5px 11px; resize: vertical; }
    .ant-ctrl:hover { border-color: #4096ff; }
    .ant-ctrl[readonly], .ant-ctrl[disabled], select.ant-ctrl:disabled {
      background: #f5f5f5; color: rgba(0,0,0,.45); cursor: not-allowed; border-color: #d9d9d9;
    }
    .req::before { content: '*'; color: #ff4d4f; margin-right: 4px; }
    .hint { font-size: 12px; color: rgba(0,0,0,.45); }
    .drawer-mask { background: rgba(0,0,0,.45); }
    .section-h {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 600; color: rgba(0,0,0,.88);
      margin: 4px 0 12px;
    }
    .section-h:before {
      content: ''; width: 3px; height: 14px; background: #1677ff; border-radius: 2px;
    }
    .sub-label { font-size: 12px; color: rgba(0,0,0,.45); margin-top: 2px; line-height: 16px; }
    .toast {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.75); color: #fff; font-size: 13px;
      padding: 8px 16px; border-radius: 6px; z-index: 80;
    }
    .proto-bar {
      background: #fff7e6; border-bottom: 1px solid #ffd591;
      color: #ad6800; font-size: 13px; padding: 8px 16px;
    }
    .eln-block { border: 1px solid #f0f0f0; border-radius: 8px; }
    table.mini { width: 100%; font-size: 13px; border-collapse: collapse; }
    table.mini th { background: #fafafa; color: rgba(0,0,0,.65); font-weight: 500; padding: 8px; border: 1px solid #f0f0f0; text-align: left; }
    table.mini td { padding: 6px 8px; border: 1px solid #f0f0f0; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .span-2 { grid-column: 1 / -1; }
    .linked-tag {
      display: inline-block; font-size: 11px; color: #1677ff; background: #e6f4ff;
      border-radius: 4px; padding: 0 6px; height: 18px; line-height: 18px; margin-left: 6px;
    }
    .block-card { border: 1px solid #f0f0f0; border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; background: #fff; }
    .block-card.muted { background: #fafafa; }
    .unit-combo { display: flex; align-items: stretch; }
    .unit-combo .num { flex: 1 1 auto; min-width: 0; border-radius: 6px 0 0 6px; }
    .unit-combo .unit { width: 108px; flex: 0 0 108px; border-radius: 0 6px 6px 0; border-left: 0; padding: 0 8px; }
    .unit-combo .unit-suffix {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; flex: 0 0 40px; border: 1px solid #d9d9d9; border-left: 0;
      border-radius: 0 6px 6px 0; background: #fafafa; color: rgba(0,0,0,.65); font-size: 14px;
    }
  </style>
</head>
<body class="bg-[#f5f5f5] text-gray-800 min-h-screen">

  <div class="proto-bar">
    原型 · 先选对象，再选该对象已配置映射的物料类型。对象信息可改；物料侧共用字段置灰，跟随对象。浓度/含量带字段单位，纯度为百分比格式；库存计量单位仍单独一项。
  </div>

  <div class="max-w-[1100px] mx-auto px-4 py-5">
    <div class="text-xs text-gray-400 mb-2">实验记录 / ELN-20260917-001</div>
    <h1 class="text-lg font-semibold mb-4">TMBS诱导Balb/c小鼠IBD模型的模型探索研究</h1>
    <div class="bg-white rounded-lg border border-gray-100 p-4 mb-4 text-sm text-gray-600 leading-6">
      合成完成后登记入库：先选要新建的对象模型，再选该对象关联的物料类型。一张单同时落下对象实体 + 物料主数据 + 批次。
    </div>
    <div class="eln-block bg-white">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
        <div class="flex items-center gap-2 font-medium"><i class="ri-flask-line text-blue-500"></i>系统-实验产出</div>
        <div class="flex items-center gap-3 text-sm">
          <button class="text-blue-600" onclick="openDrawer()">添加</button>
          <span class="text-gray-300">|</span>
          <span class="text-gray-400">批量入库</span>
          <span class="text-gray-400">删除</span>
        </div>
      </div>
      <div id="moduleEmpty" class="py-10 text-center text-gray-400 text-sm">暂无数据</div>
      <div id="moduleTable" class="hidden overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-gray-500">
            <tr>
              <th class="px-4 py-2 text-left">对象</th>
              <th class="px-4 py-2 text-left">对象编号</th>
              <th class="px-4 py-2 text-left">物料编号</th>
              <th class="px-4 py-2 text-left">名称</th>
              <th class="px-4 py-2 text-left">物料类型</th>
              <th class="px-4 py-2 text-left">批次号</th>
              <th class="px-4 py-2 text-left">状态</th>
            </tr>
          </thead>
          <tbody id="moduleBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="drawerRoot" class="fixed inset-0 hidden z-50">
    <div class="drawer-mask absolute inset-0" onclick="closeDrawer()"></div>
    <aside class="absolute right-0 top-0 h-full w-[760px] max-w-[100vw] bg-white shadow-xl flex flex-col">
      <div class="flex items-center justify-between px-5 py-3 border-b">
        <div class="font-medium">入库</div>
        <button class="text-gray-400 hover:text-gray-600" onclick="closeDrawer()"><i class="ri-close-line text-lg"></i></button>
      </div>
      <div class="flex-1 overflow-y-auto px-5 py-4" id="drawerBody"></div>
      <div class="flex justify-end gap-2 px-5 py-3 border-t bg-white">
        <button class="btn-plain border rounded-md px-4 h-8 text-sm" onclick="closeDrawer()">取消</button>
        <button class="btn-plain border rounded-md px-4 h-8 text-sm" onclick="saveDraft()">保存</button>
        <button class="btn-primary text-white rounded-md px-4 h-8 text-sm" onclick="confirmInbound()">确认入库</button>
      </div>
    </aside>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    const OBJECTS = {
      ac: {
        id: 'ac',
        name: 'Antibody Complex',
        code: 'AC-20260917-001',
        materials: ['product'],
        fields: [
          { id: 'name', label: '名称', req: true, ctrl: 'text', map: 'mat_name' },
          { id: 'code', label: '对象编号', req: false, ctrl: 'text', value: 'AC-20260917-001', system: true },
          { id: 'alias', label: '别名', req: false, ctrl: 'text', map: 'alias' },
          { id: 'spec', label: '规格', req: false, ctrl: 'text', map: 'spec' },
          { id: 'conc', label: '浓度', req: false, ctrl: 'number', map: 'conc', unitCat: 'conc', unit: 'mg/mL' },
          { id: 'purity', label: '纯度', req: false, ctrl: 'percent', map: 'purity' },
          { id: 'content', label: '含量', req: false, ctrl: 'number', map: 'content', unitCat: 'mass', unit: 'mg' },
          { id: 'maker', label: '生产厂家', req: false, ctrl: 'select', options: ['请选择', '内部制备', 'Sigma', 'Thermo'], map: 'maker' },
          { id: 'lookup_name', label: '通用名', req: false, ctrl: 'text', map: 'grade' },
          { id: 'storage', label: '储存条件', req: false, ctrl: 'select', options: ['请选择', '常温', '2-8℃', '-20℃', '-80℃'], map: 'storage' },
          { id: 'hazard', label: '危险特性', req: false, ctrl: 'select', options: ['请选择', '无', '易燃', '毒性'], map: 'hazard' },
          { id: 'cold', label: '低温保存', req: false, ctrl: 'switch', map: 'cold' },
          { id: 'msds', label: 'MSDS', req: false, ctrl: 'file', map: 'msds' },
          { id: 'img', label: '结构示意图', req: false, ctrl: 'file' },
          { id: 'seq', label: '氨基酸序列', req: false, ctrl: 'textarea', span: 2 },
          { id: 'dept', label: '所属部门', req: false, ctrl: 'text', value: '抗体研发部' },
          { id: 'project', label: '所属项目', req: false, ctrl: 'text', value: 'IBD 模型探索' },
          { id: 'visible', label: '可见范围', req: false, ctrl: 'select', options: ['项目内', '部门内', '公司内'] },
          { id: 'remark', label: '备注', req: false, ctrl: 'textarea', span: 2, map: 'remark' }
        ]
      },
      cho: {
        id: 'cho',
        name: 'CHO-K1 细胞株',
        code: 'CL-20260917-001',
        materials: ['cell'],
        fields: [
          { id: 'name', label: '名称', req: true, ctrl: 'text', map: 'mat_name' },
          { id: 'code', label: '对象编号', req: false, ctrl: 'text', value: 'CL-20260917-001', system: true },
          { id: 'alias', label: '别名', req: false, ctrl: 'text', map: 'alias' },
          { id: 'lookup_name', label: '通用名', req: false, ctrl: 'text', map: 'en_name' },
          { id: 'maker', label: '生产厂家', req: false, ctrl: 'select', options: ['请选择', '内部制备', 'ATCC'], map: 'maker' },
          { id: 'img', label: '结构示意图', req: false, ctrl: 'file', map: 'photo' },
          { id: 'storage', label: '储存条件', req: false, ctrl: 'select', options: ['请选择', '液氮', '-80℃'], map: 'storage' },
          { id: 'cold', label: '低温保存', req: false, ctrl: 'switch', map: 'cold' },
          { id: 'seq', label: '氨基酸序列', req: false, ctrl: 'textarea', span: 2 },
          { id: 'spec', label: '规格', req: false, ctrl: 'text' },
          { id: 'dept', label: '所属部门', req: false, ctrl: 'text', value: '细胞工程组' },
          { id: 'project', label: '所属项目', req: false, ctrl: 'text', value: 'IBD 模型探索' },
          { id: 'remark', label: '备注', req: false, ctrl: 'textarea', span: 2, map: 'remark' }
        ]
      },
      empty: {
        id: 'empty',
        name: '参考序列（无物料映射）',
        code: 'SEQ-20260917-001',
        materials: [],
        fields: [
          { id: 'name', label: '名称', req: true, ctrl: 'text' },
          { id: 'code', label: '对象编号', req: false, ctrl: 'text', value: 'SEQ-20260917-001', system: true },
          { id: 'seq', label: '序列', req: false, ctrl: 'textarea', span: 2 }
        ]
      }
    };

    const MATERIALS = {
      product: {
        id: 'product',
        label: '实验产物（普通物料）',
        code: 'HW-20260917-001',
        fields: [
          { id: 'mat_name', label: '物料名称', req: true, ctrl: 'text' },
          { id: 'code', label: '物料编号', req: false, ctrl: 'text', value: 'HW-20260917-001', system: true },
          { id: 'alias', label: '别名', req: false, ctrl: 'text' },
          { id: 'spec', label: '规格型号', req: false, ctrl: 'text' },
          { id: 'conc', label: '浓度', req: false, ctrl: 'number', unitCat: 'conc', unit: 'mg/mL' },
          { id: 'purity', label: '纯度', req: false, ctrl: 'percent' },
          { id: 'content', label: '含量', req: false, ctrl: 'number', unitCat: 'mass', unit: 'mg' },
          { id: 'unit', label: '计量单位', req: true, ctrl: 'select', options: ['mg', 'g', 'mL', '管'], value: 'mg', system: true },
          { id: 'maker', label: '生产厂家', req: false, ctrl: 'select', options: ['请选择', '内部制备', 'Sigma', 'Thermo'] },
          { id: 'grade', label: '级别', req: false, ctrl: 'text' },
          { id: 'storage', label: '储存条件', req: false, ctrl: 'select', options: ['请选择', '常温', '2-8℃', '-20℃', '-80℃'] },
          { id: 'hazard', label: '危险特性', req: false, ctrl: 'select', options: ['请选择', '无', '易燃', '毒性'] },
          { id: 'cold', label: '是否低温保存', req: false, ctrl: 'switch' },
          { id: 'compound', label: '化合物', req: false, ctrl: 'text' },
          { id: 'msds', label: 'MSDS 文件', req: false, ctrl: 'file' },
          { id: 'remark', label: '备注', req: false, ctrl: 'textarea', span: 2 }
        ],
        batch: [
          { id: 'lot', label: '批次号', req: true, ctrl: 'text' },
          { id: 'exp', label: '有效期至', req: false, ctrl: 'date' },
          { id: 'coa', label: 'COA', req: false, ctrl: 'file' },
          { id: 'src', label: '来源实验', req: false, ctrl: 'text', value: 'ELN-20260917-001', readonly: true }
        ]
      },
      cell: {
        id: 'cell',
        label: '细胞株库（细胞）',
        code: 'CELL-20260917-001',
        fields: [
          { id: 'mat_name', label: '物料名称', req: true, ctrl: 'text' },
          { id: 'code', label: '物料编号', req: false, ctrl: 'text', value: 'CELL-20260917-001', system: true },
          { id: 'alias', label: '别名', req: false, ctrl: 'text' },
          { id: 'en_name', label: '外文名称', req: false, ctrl: 'text' },
          { id: 'unit', label: '计量单位', req: true, ctrl: 'select', options: ['管', 'mL'], value: '管', system: true },
          { id: 'maker', label: '生产厂家', req: false, ctrl: 'select', options: ['请选择', '内部制备', 'ATCC'] },
          { id: 'photo', label: '图片', req: false, ctrl: 'file' },
          { id: 'storage', label: '储存条件', req: false, ctrl: 'select', options: ['请选择', '液氮', '-80℃'] },
          { id: 'cold', label: '是否低温保存', req: false, ctrl: 'switch' },
          { id: 'remark', label: '备注', req: false, ctrl: 'textarea', span: 2 }
        ],
        batch: [
          { id: 'lot', label: '批次号', req: true, ctrl: 'text' },
          { id: 'parent', label: '父细胞', req: false, ctrl: 'text' },
          { id: 'passage', label: '代次', req: false, ctrl: 'text' },
          { id: 'src', label: '来源实验', req: false, ctrl: 'text', value: 'ELN-20260917-001', readonly: true }
        ]
      }
    };

    const UNIT_OPTIONS = {
      conc: ['nM', 'μM', 'mM', 'M', 'mg/mL', 'μg/mL'],
      mass: ['ng', 'μg', 'mg', 'g', 'kg']
    };

    let objectId = '';
    let materialId = '';
    let containers = [];

    function showToast(text) {
      const el = document.getElementById('toast');
      el.innerText = text;
      el.classList.remove('hidden');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.add('hidden'), 1800);
    }

    function mapFromObject(obj, matFieldId) {
      if (!obj) return null;
      return obj.fields.find(f => f.map === matFieldId) || null;
    }

    function fieldCtrl(f, id, opts) {
      const linked = !!(opts && opts.linked);
      const ro = f.readonly || linked;
      const disabled = linked ? 'disabled' : '';
      const readonly = ro && f.ctrl !== 'select' && f.ctrl !== 'switch' ? 'readonly' : '';
      if (f.ctrl === 'select') {
        const optsHtml = (f.options || ['请选择']).map(o => `<option${f.value === o ? ' selected' : ''}>${o}</option>`).join('');
        return `<select id="${id}" class="ant-ctrl focus-ring" ${linked ? 'disabled' : ''}>${optsHtml}</select>`;
      }
      if (f.ctrl === 'textarea') {
        return `<textarea id="${id}" rows="2" class="ant-ctrl focus-ring" ${readonly} placeholder="${f.ph || '请输入'}">${f.value || ''}</textarea>`;
      }
      if (f.ctrl === 'switch') {
        return `<label class="inline-flex items-center gap-2 h-8 text-sm ${linked ? 'opacity-60 pointer-events-none' : ''}"><input type="checkbox" id="${id}" class="accent-blue-600" ${linked ? 'disabled' : ''}> 是</label>`;
      }
      if (f.ctrl === 'file') {
        return `<button type="button" class="ant-ctrl text-left text-gray-400" ${linked ? 'disabled' : ''}>选择文件</button>`;
      }
      if (f.ctrl === 'date') {
        return `<input type="date" id="${id}" class="ant-ctrl focus-ring" ${readonly}>`;
      }
      if (f.ctrl === 'percent') {
        return `<div class="unit-combo"><input ${readonly} id="${id}" class="ant-ctrl focus-ring num" placeholder="请输入" value="${f.value || ''}"><span class="unit-suffix">%</span></div>`;
      }
      if (f.unitCat) {
        const units = UNIT_OPTIONS[f.unitCat] || [f.unit];
        const optsHtml = units.map(u => `<option${u === f.unit ? ' selected' : ''}>${u}</option>`).join('');
        return `<div class="unit-combo"><input ${readonly} id="${id}" class="ant-ctrl focus-ring num" placeholder="请输入" value="${f.value || ''}"><select id="${id}_unit" class="ant-ctrl focus-ring unit" ${linked ? 'disabled' : ''}>${optsHtml}</select></div>`;
      }
      return `<input ${readonly} id="${id}" class="ant-ctrl focus-ring" placeholder="${f.ph || '请输入'}" value="${f.value || ''}">`;
    }

    function fieldCell(f, id, extra) {
      extra = extra || {};
      const span = f.span === 2 || extra.span2 ? 'span-2' : '';
      const tag = extra.tag ? `<span class="linked-tag">${extra.tag}</span>` : '';
      const sub = extra.sub ? `<div class="sub-label">${extra.sub}</div>` : (f.system && !extra.tag ? `<div class="sub-label">按规则生成，可改</div>` : '');
      return `<div class="${span}">
        <label class="block text-sm mb-1 ${f.req ? 'req' : ''}">${f.label}${tag}</label>
        ${fieldCtrl(f, id, extra)}${sub}
      </div>`;
    }

    function renderDrawer() {
      const obj = OBJECTS[objectId];
      const mats = obj ? obj.materials.map(id => MATERIALS[id]) : [];
      const mat = MATERIALS[materialId];

      const objOptions = Object.values(OBJECTS).map(o =>
        `<option value="${o.id}" ${o.id === objectId ? 'selected' : ''}>${o.name}</option>`
      ).join('');

      let matOptions = '<option value="">请选择</option>';
      if (obj && mats.length) {
        matOptions += mats.map(m => `<option value="${m.id}" ${m.id === materialId ? 'selected' : ''}>${m.label}</option>`).join('');
      } else if (obj && !mats.length) {
        matOptions = '<option value="">该对象未配置物料映射</option>';
      }

      let html = `
        <div class="block-card">
          <div class="grid-2">
            <div>
              <label class="block text-sm mb-1 req">对象</label>
              <select id="objectSelect" class="ant-ctrl focus-ring" onchange="onObjectChange(this.value)">
                <option value="">请选择</option>
                ${objOptions}
              </select>
              <div class="sub-label">先选要新建的对象模型</div>
            </div>
            <div>
              <label class="block text-sm mb-1 req">物料类型</label>
              <select id="materialSelect" class="ant-ctrl focus-ring" onchange="onMaterialChange(this.value)" ${!objectId || !mats.length ? 'disabled' : ''}>
                ${matOptions}
              </select>
              <div class="sub-label">${!objectId ? '请先选择对象' : (mats.length ? '仅列出该对象已配置映射的物料类型' : '无关联物料类型，无法双建入库')}</div>
            </div>
          </div>
        </div>
      `;

      if (obj) {
        html += `<div class="block-card">
          <div class="section-h">对象信息</div>
          <div class="hint mb-3">本次新建「${obj.name}」实体，字段可编辑。带映射的字段会同步到下方物料主数据。</div>
          <div class="grid-2">`;
        obj.fields.forEach(f => {
          const mapped = f.map ? MATERIALS[materialId] && mapFromObject(obj, f.map) : null;
          const extra = {
            tag: f.map && mat ? '映射' : '',
            sub: f.map && mat ? `同步到物料：${(mat.fields.find(x => x.id === f.map) || {}).label || f.map}` : (f.system ? '按对象规则生成，可改' : '')
          };
          html += fieldCell(f, 'o_' + f.id, extra);
        });
        html += `</div></div>`;
      }

      if (obj && mat) {
        html += `<div class="block-card muted">
          <div class="section-h">物料主数据</div>
          <div class="hint mb-3">全部物料字段都展示。蓝色「联动」项置灰，跟随上方对象，不可单独改。</div>
          <div class="grid-2">`;
        mat.fields.forEach(f => {
          const src = mapFromObject(obj, f.id);
          const extra = src
            ? { linked: true, tag: '联动', sub: `来自对象「${src.label}」，不可单独修改` }
            : { sub: f.system ? '按物料类型规则生成，可改' : (f.id === 'compound' ? '未映射，仅物料侧填写' : '') };
          html += fieldCell(f, 'm_' + f.id, extra);
        });
        html += `</div></div>`;

        html += `<div class="block-card">
          <div class="section-h">批次信息</div>
          <div class="hint mb-3">不走映射，始终手填。来源实验自动写入当前记录。</div>
          <div class="grid-2">`;
        mat.batch.forEach(f => { html += fieldCell(f, 'b_' + f.id); });
        html += `</div></div>`;

        html += `<div class="block-card">
          <div class="section-h">存放信息</div>
          <div class="grid-2 mb-3">
            <div>
              <label class="block text-sm mb-1 req">容器</label>
              <select id="containerType" class="ant-ctrl focus-ring"><option>瓶</option><option>管</option><option>孔板</option></select>
            </div>
            <div>
              <label class="block text-sm mb-1">仓库</label>
              <select class="ant-ctrl focus-ring"><option>请选择</option><option>产物库 A</option><option>冷库</option></select>
              <div class="sub-label">可空，库管上架时再指定</div>
            </div>
          </div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-sm">容器信息</span>
            <button type="button" class="text-blue-600 text-sm" onclick="addContainer()">+ 新增</button>
          </div>
          <table class="mini">
            <thead><tr><th>序号</th><th>容器编号</th><th>数量</th><th>单位</th><th></th></tr></thead>
            <tbody id="cbody"></tbody>
          </table>
          <div id="cempty" class="text-center text-gray-400 text-sm py-3 border border-t-0 border-gray-100">暂无数据</div>
        </div>`;
      }

      document.getElementById('drawerBody').innerHTML = html;
      bindSync();
      renderContainers();
    }

    function bindSync() {
      const obj = OBJECTS[objectId];
      const mat = MATERIALS[materialId];
      if (!obj || !mat) return;
      obj.fields.forEach(f => {
        if (!f.map) return;
        const src = document.getElementById('o_' + f.id);
        const dst = document.getElementById('m_' + f.map);
        if (!src || !dst) return;
        const copy = () => {
          if (src.type === 'checkbox') dst.checked = src.checked;
          else dst.value = src.value;
          const su = document.getElementById(src.id + '_unit');
          const du = document.getElementById(dst.id + '_unit');
          if (su && du) du.value = su.value;
        };
        copy();
        src.addEventListener('input', copy);
        src.addEventListener('change', copy);
        const suEl = document.getElementById(src.id + '_unit');
        if (suEl) suEl.addEventListener('change', copy);
      });
    }

    function renderContainers() {
      const body = document.getElementById('cbody');
      const empty = document.getElementById('cempty');
      if (!body) return;
      body.innerHTML = containers.map((c, i) => `
        <tr>
          <td>${i + 1}</td>
          <td><input class="ant-ctrl" value="${c.code}" onchange="containers[${i}].code=this.value"></td>
          <td><input class="ant-ctrl" value="${c.qty}" onchange="containers[${i}].qty=this.value"></td>
          <td>${c.unit}</td>
          <td><button class="text-red-500 text-xs" onclick="containers.splice(${i},1);renderContainers()">删除</button></td>
        </tr>`).join('');
      empty.classList.toggle('hidden', containers.length > 0);
    }

    function addContainer() {
      const unitEl = document.getElementById('m_unit');
      const unit = unitEl ? unitEl.value : 'mg';
      containers.push({ code: 'C' + String(containers.length + 1).padStart(3, '0'), qty: '', unit });
      renderContainers();
    }

    function onObjectChange(id) {
      objectId = id;
      const obj = OBJECTS[id];
      materialId = obj && obj.materials.length === 1 ? obj.materials[0] : '';
      containers = [];
      renderDrawer();
    }

    function onMaterialChange(id) {
      materialId = id;
      containers = [];
      renderDrawer();
    }

    function openDrawer() {
      objectId = '';
      materialId = '';
      containers = [];
      document.getElementById('drawerRoot').classList.remove('hidden');
      renderDrawer();
    }

    function closeDrawer() {
      document.getElementById('drawerRoot').classList.add('hidden');
    }

    function saveDraft() {
      showToast('已保存为草稿（原型，未落库）');
      closeDrawer();
    }

    function val(id) {
      const el = document.getElementById(id);
      return el ? String(el.value || '').trim() : '';
    }

    function confirmInbound() {
      const obj = OBJECTS[objectId];
      const mat = MATERIALS[materialId];
      if (!obj) { showToast('请选择对象'); return; }
      if (!mat) { showToast('请选择物料类型'); return; }
      if (!val('o_name')) { showToast('请填写对象名称'); return; }
      if (!val('b_lot')) { showToast('请填写批次号'); return; }
      if (!containers.length || containers.some(c => !c.qty)) { showToast('请至少新增一条容器并填写数量'); return; }
      document.getElementById('moduleEmpty').classList.add('hidden');
      document.getElementById('moduleTable').classList.remove('hidden');
      const tr = document.createElement('tr');
      tr.className = 'border-t';
      tr.innerHTML = `
        <td class="px-4 py-2">${obj.name}</td>
        <td class="px-4 py-2 text-blue-600">${obj.code}</td>
        <td class="px-4 py-2">${mat.code}</td>
        <td class="px-4 py-2">${val('o_name')}</td>
        <td class="px-4 py-2">${mat.label}</td>
        <td class="px-4 py-2">${val('b_lot')}</td>
        <td class="px-4 py-2"><span class="text-xs px-2 py-0.5 rounded bg-blue-50 text-blue-600">已登记 / 待上架</span></td>`;
      document.getElementById('moduleBody').appendChild(tr);
      showToast('已同时创建对象与物料（原型）');
      closeDrawer();
    }
  </script>
</body>
</html>
